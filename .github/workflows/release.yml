name: Release module
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release ref
        env:
          REF: ${{ github.ref }}
        run: |
          [[ "$REF" == refs/tags/v* ]] || { echo 'Run this workflow on a version tag'; exit 1; }
      - name: Validate shell syntax and build
        run: |
          bash -n customize.sh service.sh cleanup.sh post-fs-data.sh uninstall.sh
          python3 tests/check_bpf_parser.py
          python3 tests/check_release_notes.py
          python3 scripts/build.py
      - name: Attest module ZIP
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*.zip
      - name: Preserve build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-release
          path: dist/*
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "Kernel TTL Tether Fix $TAG" --notes-file dist/changelog.md
